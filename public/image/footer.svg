<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 160" width="1280" height="160" role="img" aria-label="Footer DC Forge PRO" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081030"/>
      <stop offset="0.55" stop-color="#15206B"/>
      <stop offset="1" stop-color="#3B1D7A"/>
    </linearGradient>
    <linearGradient id="pro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; font-size: 22px; fill: #FFFFFF; }
      .s { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 500; font-size: 14px; fill: #93C5FD; letter-spacing: 1px; }
      .w { animation: slide 7s ease-in-out infinite alternate; }
      @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-40px); } }
    </style>
  </defs>

  <rect width="1280" height="160" fill="url(#bg)"/>
  <circle cx="1100" cy="150" r="170" fill="url(#orb)"/>

  <g class="w">
    <path d="M-40 110 C 160 70, 320 150, 520 110 S 880 70, 1080 112 S 1280 130, 1340 100 L1340 170 L-40 170 Z" fill="url(#w1)"/>
    <path d="M-40 130 C 200 100, 360 160, 600 128 S 940 100, 1140 132 S 1300 140, 1340 120 L1340 170 L-40 170 Z" fill="url(#w2)"/>
  </g>

  <rect x="0" y="0" width="1280" height="4" fill="url(#pro)"/>

  <text class="t" x="640" y="62" text-anchor="middle">DC Forge PRO</text>
  <text class="s" x="640" y="92" text-anchor="middle">© 2026 DC Forge  •  Developed by Dori Frans Dika</text>
</svg>
