<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="DC Forge PRO - Advanced Student ID Card and Print Engine" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081030"/>
      <stop offset="0.55" stop-color="#15206B"/>
      <stop offset="1" stop-color="#3B1D7A"/>
    </linearGradient>
    <linearGradient id="pro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="0.6" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#D4A017"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .title { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; font-size: 78px; letter-spacing: -1px; }
      .sub   { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; font-size: 34px; fill: #FFFFFF; }
      .tag   { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 500; font-size: 24px; fill: #38BDF8; letter-spacing: 1px; }
      .pill  { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 600; font-size: 16px; fill: #BAE6FD; }
      .ct    { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; font-size: 15px; fill: #FFFFFF; }
      .cs    { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 500; font-size: 11px; fill: #C7D2FE; }
      .float { animation: float 5s ease-in-out infinite; }
      .orb   { animation: drift 8s ease-in-out infinite alternate; }
      .scan  { animation: scan 3s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(26px); } }
      @keyframes scan  { 0%,100% { opacity: .15; transform: translateY(0); } 50% { opacity: .9; transform: translateY(70px); } }
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle class="orb" cx="120" cy="330" r="190" fill="url(#orbA)"/>
  <circle class="orb" cx="1180" cy="40" r="210" fill="url(#orbB)"/>

  <!-- dot grid -->
  <g fill="#7DD3FC" opacity="0.28">
    <circle cx="700" cy="40" r="2"/><circle cx="724" cy="40" r="2"/><circle cx="748" cy="40" r="2"/><circle cx="772" cy="40" r="2"/>
    <circle cx="700" cy="64" r="2"/><circle cx="724" cy="64" r="2"/><circle cx="748" cy="64" r="2"/><circle cx="772" cy="64" r="2"/>
    <circle cx="700" cy="88" r="2"/><circle cx="724" cy="88" r="2"/><circle cx="748" cy="88" r="2"/><circle cx="772" cy="88" r="2"/>
  </g>

  <!-- App icon -->
  <g transform="translate(64,70) rotate(-8 60 50)">
    <rect width="130" height="100" rx="24" fill="url(#icon)" filter="url(#shadow)"/>
    <rect x="3" y="3" width="124" height="94" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="38" cy="38" r="12" fill="#FFFFFF"/>
    <path d="M18 74 Q38 52 58 74 Z" fill="#FFFFFF"/>
    <rect x="72" y="28" width="42" height="7" rx="3.5" fill="#FFFFFF"/>
    <rect x="72" y="44" width="42" height="7" rx="3.5" fill="#FFFFFF" opacity="0.85"/>
    <rect x="72" y="60" width="30" height="7" rx="3.5" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Title -->
  <text class="title" x="230" y="126"><tspan fill="#FFFFFF">DC Forge </tspan><tspan fill="url(#pro)">PRO</tspan></text>
  <text class="sub" x="232" y="172">Student ID Card &amp; Print Engine</text>
  <text class="tag" x="232" y="210">Advanced · 3D Preview · 2D Flat Print</text>

  <!-- Pill -->
  <rect x="232" y="240" width="292" height="40" rx="20" fill="#0B1A4A" fill-opacity="0.75" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="1.5"/>
  <circle cx="256" cy="260" r="6" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M250 260 H262 M256 254 Q252 260 256 266 M256 254 Q260 260 256 266" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
  <text class="pill" x="274" y="266">Web Application (Frontend Only)</text>

  <!-- ID Card mockup -->
  <g class="float">
    <g transform="translate(905,70) rotate(6 150 95)" filter="url(#shadow)">
      <rect width="300" height="190" rx="18" fill="url(#card)"/>
      <rect x="1.5" y="1.5" width="297" height="187" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="262" cy="26" r="40" fill="#FFFFFF" opacity="0.06"/>
      <text class="ct" x="22" y="34">UNIVERSITAS CONTOH</text>
      <text class="cs" x="22" y="50">KARTU TANDA MAHASISWA</text>
      <!-- chip -->
      <rect x="22" y="66" width="38" height="28" rx="6" fill="url(#gold)"/>
      <path d="M22 80 H60 M41 66 V94" stroke="#8A6A10" stroke-width="1.2"/>
      <!-- photo -->
      <rect x="22" y="108" width="52" height="64" rx="8" fill="#0B1A4A" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.5"/>
      <circle cx="48" cy="130" r="9" fill="#FFFFFF" opacity="0.9"/>
      <path d="M32 164 Q48 142 64 164 Z" fill="#FFFFFF" opacity="0.9"/>
      <!-- text lines -->
      <text class="ct" x="90" y="124">Dori Frans Dika</text>
      <text class="cs" x="90" y="142">NIM  2011XXXXX</text>
      <text class="cs" x="90" y="158">Teknik Informatika</text>
      <!-- QR -->
      <g transform="translate(222,100)">
        <rect width="58" height="58" rx="6" fill="#FFFFFF"/>
        <g fill="#000000">
          <rect x="6" y="6" width="16" height="16"/><rect x="36" y="6" width="16" height="16"/><rect x="6" y="36" width="16" height="16"/>
          <rect x="28" y="28" width="6" height="6"/><rect x="38" y="30" width="8" height="6"/><rect x="30" y="40" width="6" height="12"/><rect x="42" y="42" width="10" height="10"/>
        </g>
        <g fill="#FFFFFF"><rect x="10" y="10" width="8" height="8"/><rect x="40" y="10" width="8" height="8"/><rect x="10" y="40" width="8" height="8"/></g>
      </g>
      <!-- scan line -->
      <rect class="scan" x="218" y="98" width="66" height="3" rx="1.5" fill="#22D3EE"/>
    </g>
  </g>

  <!-- bottom accent line -->
  <rect x="0" y="352" width="1280" height="8" fill="url(#pro)"/>
</svg>
